description = "Engineer in a Box - the canonical right way. Design before you code. Review before you ship. Test before you submit."
formula = "shiny"
type = "workflow"
version = 2

[[steps]]
acceptance = "Design doc committed covering approach, trade-offs, and files to change"
description = "Think carefully about architecture before writing code. Consider: How does this fit into the existing system? What are the edge cases? What could go wrong? Is there a simpler approach?"
id = "design"
title = "Design {{feature}}"

[[steps]]
acceptance = "All files from the design doc are modified/created and committed"
description = "Write the code for {{feature}}. Follow the design. Keep it simple. Don't gold-plate."
id = "implement"
needs = ["design"]
title = "Implement {{feature}}"

[[steps]]
acceptance = "Self-review complete, no obvious bugs, code is readable and secure"
description = "Review the implementation. Check for: Does it match the design? Are there obvious bugs? Is it readable and maintainable? Are there security concerns?"
id = "review"
needs = ["implement"]
title = "Review implementation"

[[steps]]
acceptance = "All tests pass, no regressions, test coverage for new code"
description = "Write and run tests. Unit tests for new code, integration tests if needed, run the full test suite, fix any regressions."
id = "test"
needs = ["review"]
title = "Test {{feature}}"

[[steps]]
acceptance = "Feature/fix exercised empirically with documented evidence (command output, response, or log lines)"
description = """
Empirically verify that your work actually works — don't just trust that tests pass.

**This step prevents the #1 quality failure: closing work that was never actually exercised.**

**1. Identify what you built or fixed:**
What is the observable behavior change? State it concretely:
- "New endpoint /api/foo returns a JSON response"
- "Bug where X happened is now gone"
- "Config change causes Y behavior"

**2. Exercise it — run it, trigger it, observe the output:**

| Change type | How to verify |
|-------------|---------------|
| Bug fix | Reproduce the original bug scenario, show it no longer occurs |
| New endpoint/API | curl it, show the response |
| CLI command | Run it with representative args, show the output |
| Config change | Show the new behavior is active (logs, output, state) |
| UI change | Build and show rendered output or screenshot |
| Library/internal change | Write a small driver or use an existing caller to demonstrate |
| Refactor | Show before/after behavior is identical on a representative case |

**3. Document the evidence:**
Capture the actual command and its output. This evidence will be included in
the MR description so reviewers can see the feature was verified.

Example:
```
## Verification
$ curl -s localhost:8080/api/health | jq .
{"status": "ok", "version": "1.2.3"}

$ gt sync --dry-run
Synced 3 forks (0 errors)
```

**4. If verification fails:**
- Do NOT proceed to submit
- Fix the issue, re-run tests, and re-verify
- If you cannot make it work, reopen the issue and document what failed:
  ```bash
  bd update <issue> --notes "Verification failed: <what happened>"
  ```

**If the change genuinely cannot be exercised** (e.g., pure documentation,
comment-only changes, or dependency bumps with no observable behavior change),
document WHY empirical verification is not applicable and proceed.

**If you concluded 'no changes needed'** (bug already fixed, can't reproduce):
This step STILL applies. You must exercise the scenario to PROVE it works.
If verification confirms it works: `bd update <issue> --notes "Verified: <evidence>"`
then close with `bd close <issue> --reason="no-changes: verified — <evidence>"`
and `gt done --empirically-verified --cleanup-status clean`.
If verification FAILS: do NOT close — implement the fix instead.

**5. Integration-touching changes — flag for post-merge crew verification:**

If your changes touch external integrations that cannot be fully exercised in
the polecat sandbox, flag them for crew post-merge verification:

| Integration | Examples | Why you can't verify live |
|-------------|----------|--------------------------|
| Telegram API | Controlle hooks, bot commands | Requires live bot token and supergroup |
| Dolt server | Schema migrations, server lifecycle | Production server, not test instance |
| Git remotes | Push/fetch/clone operations | Requires real remote access |
| External APIs | Webhooks, OAuth flows | Requires live credentials/endpoints |

When your change touches these integrations:
1. Verify everything you CAN locally (unit tests, mocked paths, CLI parsing)
2. Document what CANNOT be verified pre-merge
3. Flag it on the bead for crew post-merge verification:
   ```bash
   bd update <issue> --add-label needs-post-merge-verification
   bd update <issue> --notes "POST-MERGE VERIFICATION NEEDED:
   Integration: <which integration>
   What to verify: <specific behavior to check after merge>
   How to verify: <steps the crew should follow>"
   ```

This ensures the crew review gate catches integration-touching merges and
schedules live verification after the code lands on main."""
id = "verify"
needs = ["test"]
title = "Verify {{feature}}"

[[steps]]
acceptance = "Clean git status, clear commit message, code pushed to feature branch"
description = "Submit for merge. Final check: git status, git diff. Commit with clear message. Follow your role's git workflow for landing code."
id = "submit"
needs = ["verify"]
title = "Submit for merge"

[vars]
[vars.assignee]
description = "Who is assigned to this work"
[vars.feature]
description = "The feature being implemented"
required = true
